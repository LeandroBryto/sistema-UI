<div class="grid">
    <div class="col-12">
        <div class="card">
            <div class="flex justify-content-between align-items-center mb-4">
                <h4>Loja de Recompensas</h4>
                <div class="flex align-items-center">
                    <span class="text-xl font-bold mr-2 text-primary">{{moedasNexus}}</span>
                    <i class="pi pi-bitcoin text-yellow-500 text-xl" title="Moedas Nexus"></i>
                </div>
            </div>

            <p-tabView>
                <p-tabPanel header="Avatares">
                    <div class="grid">
                        <div class="col-12 md:col-6 lg:col-4 xl:col-3" *ngFor="let item of avatares">
                            <div class="card border-1 surface-border p-4 text-center h-full flex flex-column justify-content-between">
                                <div>
                                    <div class="mb-3">
                                        <i class="pi pi-user text-5xl text-primary"></i>
                                    </div>
                                    <div class="text-xl font-bold mb-2">{{item.nome}}</div>
                                    <div class="text-500 mb-3">{{item.descricao}}</div>
                                </div>
                                <div class="flex flex-column gap-2">
                                    <div class="text-2xl font-bold text-primary">{{item.preco}} <i class="pi pi-bitcoin text-yellow-500 text-sm"></i></div>
                                    <p-button 
                                        [label]="item.adquirido ? 'Adquirido' : 'Comprar'" 
                                        [icon]="item.adquirido ? 'pi pi-check' : 'pi pi-shopping-cart'" 
                                        [disabled]="item.adquirido"
                                        [severity]="item.adquirido ? 'success' : 'primary'"
                                        (onClick)="confirmarCompra(item)">
                                    </p-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </p-tabPanel>
                <p-tabPanel header="Temas de Fundo">
                    <div class="grid">
                        <div class="col-12 md:col-6 lg:col-4 xl:col-3" *ngFor="let item of temas">
                            <div class="card border-1 surface-border p-4 text-center h-full flex flex-column justify-content-between">
                                <div>
                                    <div class="mb-3">
                                        <i class="pi pi-image text-5xl text-purple-500"></i>
                                    </div>
                                    <div class="text-xl font-bold mb-2">{{item.nome}}</div>
                                    <div class="text-500 mb-3">{{item.descricao}}</div>
                                </div>
                                <div class="flex flex-column gap-2">
                                    <div class="text-2xl font-bold text-primary">{{item.preco}} <i class="pi pi-bitcoin text-yellow-500 text-sm"></i></div>
                                    <p-button 
                                        [label]="item.adquirido ? 'Adquirido' : 'Comprar'" 
                                        [icon]="item.adquirido ? 'pi pi-check' : 'pi pi-shopping-cart'" 
                                        [disabled]="item.adquirido"
                                        [severity]="item.adquirido ? 'success' : 'primary'"
                                        (onClick)="confirmarCompra(item)">
                                    </p-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </p-tabPanel>
                <p-tabPanel header="Sons de Ambiente">
                    <div class="grid">
                        <div class="col-12 md:col-6 lg:col-4 xl:col-3" *ngFor="let item of sons">
                            <div class="card border-1 surface-border p-4 text-center h-full flex flex-column justify-content-between">
                                <div>
                                    <div class="mb-3">
                                        <i class="pi pi-volume-up text-5xl text-orange-500"></i>
                                    </div>
                                    <div class="text-xl font-bold mb-2">{{item.nome}}</div>
                                    <div class="text-500 mb-3">{{item.descricao}}</div>
                                </div>
                                <div class="flex flex-column gap-2">
                                    <div class="text-2xl font-bold text-primary">{{item.preco}} <i class="pi pi-bitcoin text-yellow-500 text-sm"></i></div>
                                    <p-button 
                                        [label]="item.adquirido ? 'Adquirido' : 'Comprar'" 
                                        [icon]="item.adquirido ? 'pi pi-check' : 'pi pi-shopping-cart'" 
                                        [disabled]="item.adquirido"
                                        [severity]="item.adquirido ? 'success' : 'primary'"
                                        (onClick)="confirmarCompra(item)">
                                    </p-button>
                                </div>
                            </div>
                        </div>
                    </div>
                </p-tabPanel>
            </p-tabView>
        </div>
    </div>
</div>
<p-confirmDialog></p-confirmDialog>
<p-toast></p-toast>
