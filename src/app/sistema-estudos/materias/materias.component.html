<div class="materias-container">
  <header class="header">
    <h1>Minhas Matérias</h1>
    <div class="header-actions">
      <p-button
        label="Nova Matéria"
        icon="pi pi-plus"
        styleClass="p-button-primary"
        (click)="abrirDialogNovaMateria()">
      </p-button>
    </div>
  </header>

  <!-- Loading State -->
  <div class="loading-section" *ngIf="loading">
    <div class="loading-content">
      <i class="pi pi-spin pi-spinner loading-icon"></i>
      <p>Carregando matérias...</p>
    </div>
  </div>

  <!-- Grid de Matérias -->
  <div class="materias-grid" *ngIf="!loading">
    <p-card
      *ngFor="let materia of getMateriasFiltradas()"
      class="materia-card"
      [style.border-left-color]="materia.corHex">

      <div class="materia-header">
        <div class="materia-icon" [style.color]="materia.corHex" [style.background-color]="materia.corHex + '20'">
          <i [class]="'pi pi-' + materia.icone"></i>
        </div>
        <div class="materia-info">
          <h3>{{ materia.nome }}</h3>
          <div class="materia-meta">
            <span class="materia-data" *ngIf="materia.dataCriacao">
              Criada em {{ materia.dataCriacao | date:'dd/MM/yyyy' }}
            </span>
          </div>
        </div>
      </div>

      <div class="materia-actions">
        <p-button
          label="Editar"
          icon="pi pi-pencil"
          styleClass="p-button-text p-button-sm"
          (click)="abrirDialogEditarMateria(materia)"
          pTooltip="Editar matéria">
        </p-button>

        <p-button
          label="Ver Detalhes"
          icon="pi pi-eye"
          styleClass="p-button-text p-button-sm"
          pTooltip="Ver tópicos e flashcards">
        </p-button>

        <p-button
          label="Excluir"
          icon="pi pi-trash"
          styleClass="p-button-text p-button-danger p-button-sm"
          (click)="excluirMateria(materia)"
          pTooltip="Excluir matéria permanentemente">
        </p-button>
      </div>
    </p-card>

    <!-- Estado Vazio -->
    <div class="empty-state" *ngIf="getMateriasFiltradas().length === 0">
      <div class="empty-content">
        <i class="pi pi-book empty-icon"></i>
        <h3>Nenhuma matéria encontrada</h3>
        <p>
          Comece criando sua primeira matéria de estudo!
        </p>
        <p-button
          label="Criar Primeira Matéria"
          icon="pi pi-plus"
          styleClass="p-button-primary"
          (click)="abrirDialogNovaMateria()">
        </p-button>
      </div>
    </div>
  </div>

  <!-- Modal: Nova Matéria -->
  <p-dialog
    [(visible)]="mostrarDialogNovaMateria"
    [modal]="true"
    [style]="{width: '500px'}"
    [draggable]="false"
    [resizable]="false"
    [header]="editandoMateria ? 'Editar Matéria' : 'Nova Matéria'">

    <div class="form-group">
      <label for="nome">Nome da Matéria *</label>
      <input
        pInputText
        id="nome"
        [(ngModel)]="novaMateria.nome"
        placeholder="Ex: Matemática, Português, Física..."
        class="form-control"
        maxlength="100">
      <small class="form-help">O nome deve ser único e é obrigatório.</small>
    </div>

    <div class="form-group">
      <label for="cor">Cor da Matéria</label>
      <div class="color-picker-container">
        <p-colorPicker
          [(ngModel)]="novaMateria.corHex"
          format="hex"
          [inline]="false">
        </p-colorPicker>
        <div class="color-preview" [style.background-color]="novaMateria.corHex">
          <span class="color-hex">{{ novaMateria.corHex }}</span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="icone">Ícone</label>
      <p-dropdown
        [options]="iconesDisponiveis"
        [(ngModel)]="novaMateria.icone"
        optionLabel="label"
        optionValue="value"
        placeholder="Selecione um ícone"
        [showClear]="false">
        <ng-template pTemplate="selectedItem" let-selectedItem>
          <div class="icone-selecionado" *ngIf="selectedItem">
            <i [class]="selectedItem.value"></i>
            <span>{{ selectedItem.label }}</span>
          </div>
        </ng-template>
        <ng-template pTemplate="item" let-item>
          <div class="icone-item">
            <i [class]="item.value"></i>
            <span>{{ item.label }}</span>
          </div>
        </ng-template>
      </p-dropdown>
    </div>

    <ng-template pTemplate="footer">
      <p-button
        label="Cancelar"
        icon="pi pi-times"
        (click)="mostrarDialogNovaMateria = false"
        styleClass="p-button-text">
      </p-button>

      <p-button
        [label]="editandoMateria ? 'Atualizar Matéria' : 'Criar Matéria'"
        icon="pi pi-check"
        (click)="salvarNovaMateria()"
        [disabled]="!novaMateria.nome.trim()"
        styleClass="p-button-primary">
      </p-button>
    </ng-template>
  </p-dialog>

  <!-- Toast para mensagens -->
  <p-toast></p-toast>
</div>
