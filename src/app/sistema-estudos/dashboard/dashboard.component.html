<div class="estudos-dashboard">
  <!-- Header -->
  <div class="dashboard-header flex justify-content-between align-items-center mb-5">
    <div>
      <h1 class="text-3xl font-bold m-0">Sistema de Estudos</h1>
      <p class="text-color-secondary mt-1">Acompanhe seu progresso acadêmico</p>
    </div>
    <div class="header-actions">
      <button pButton label="VIRAR PREMIUM" icon="pi pi-star" class="p-button-warning" (click)="openUpgradeModal()"></button>
    </div>
  </div>

  <!-- KPI Grid -->
  <div class="kpi-grid">
    <div class="card kpi-card">
      <div class="kpi-content">
        <span class="kpi-label">Cursos Ativos</span>
        <span class="kpi-value">5</span>
        <div class="kpi-trend ok">
          <i class="pi pi-arrow-up"></i>
          <span>2 novos este mês</span>
        </div>
      </div>
      <div class="kpi-icon-wrapper">
        <i class="pi pi-book text-xl text-blue-400"></i>
      </div>
    </div>

    <div class="card kpi-card">
      <div class="kpi-content">
        <span class="kpi-label">Horas Estudadas</span>
        <span class="kpi-value">120h</span>
        <div class="kpi-trend ok">
          <i class="pi pi-arrow-up"></i>
          <span>15% este mês</span>
        </div>
      </div>
      <div class="kpi-icon-wrapper">
        <i class="pi pi-clock text-xl text-green-400"></i>
      </div>
    </div>

    <div class="card kpi-card">
      <div class="kpi-content">
        <span class="kpi-label">Certificações</span>
        <span class="kpi-value">3</span>
        <div class="kpi-trend ok">
          <i class="pi pi-check-circle"></i>
          <span>1 nova este mês</span>
        </div>
      </div>
      <div class="kpi-icon-wrapper">
        <i class="pi pi-trophy text-xl text-yellow-400"></i>
      </div>
    </div>

    <div class="card kpi-card">
      <div class="kpi-content">
        <span class="kpi-label">Progresso Médio</span>
        <span class="kpi-value">75%</span>
        <div class="kpi-trend ok">
          <i class="pi pi-arrow-up"></i>
          <span>5% este mês</span>
        </div>
      </div>
      <div class="kpi-icon-wrapper">
        <i class="pi pi-chart-line text-xl text-purple-400"></i>
      </div>
    </div>
  </div>

  <!-- Progress Section -->
  <div class="grid mt-5">
    <div class="col-12 md:col-6">
      <p-card header="Curso de Angular">
        <p>Progresso: 80%</p>
        <p-progressBar [value]="80" [showValue]="true"></p-progressBar>
      </p-card>
    </div>
    <div class="col-12 md:col-6">
      <p-card header="Curso de TypeScript">
        <p>Progresso: 60%</p>
        <p-progressBar [value]="60" [showValue]="true"></p-progressBar>
      </p-card>
    </div>
  </div>
</div>
